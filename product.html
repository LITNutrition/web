<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalle del producto LIT Nutrition.">
  <link rel="icon" type="image/png" href="public/icon/image/logo.png">
  <title>Nutrition: Producto</title>
  <link rel="preload" as="image" href="public/icon/image/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-loader" class="app-loader">
    <div class="loader-logo">LIT</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>
  <script>
    if (sessionStorage.getItem('lit-loaded')) {
      document.getElementById('app-loader')?.classList.add('hidden');
    } else {
      sessionStorage.setItem('lit-loaded', '1');
    }
  </script>

  <div id="product-page-content"></div>

  <div class="modal-overlay" id="buy-modal">
    <div class="modal-box">
      <button class="modal-close" id="buy-modal-close"><i data-lucide="x"></i></button>
      <div id="buy-modal-content"></div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="js/product-main.js"></script>
</body>
</html>
